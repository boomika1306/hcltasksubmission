version: '3.8'

services:
  # MongoDB - Permanent Document Storage
  mongodb:
    image: mongo:7.0
    container_name: livepoll-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=livepoll

  # Mongo Express - Web UI Dashboard for inspecting MongoDB collections
  mongo-express:
    image: mongo-express:latest
    container_name: livepoll-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      - mongodb

  # Redis - Real-Time In-Memory Pub/Sub Message Broker
  redis:
    image: redis:7.2-alpine
    container_name: livepoll-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongo_data:
  redis_data:
